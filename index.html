<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mahasiswa - Presensi Kelas 2026C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">
    <!-- Header Mahasiswa -->
    <header class="bg-indigo-950 text-white shadow-lg border-b border-indigo-900 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-inner">
                        <i class="fas fa-user-graduate text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base sm:text-lg leading-tight">Presensi Mahasiswa</h1>
                        <p class="text-xs text-indigo-300">S1 PTI - Kelas 2026C</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        <!-- Selector Mahasiswa -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                <i class="fas fa-user text-indigo-600 mr-1"></i> Pilih Nama Mahasiswa
            </label>
            <select id="studentSelect" onchange="onStudentChange()" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50 font-medium">
                <!-- Populated by JS -->
            </select>
        </div>

        <!-- Student Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-3">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl"><i class="fas fa-check-circle text-lg"></i></div>
                <div>
                    <p class="text-[11px] text-slate-500 font-medium">Total Hadir</p>
                    <p id="stHadirCount" class="text-lg font-bold text-slate-800">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-3">
                <div class="p-3 bg-amber-100 text-amber-600 rounded-xl"><i class="fas fa-envelope-open-text text-lg"></i></div>
                <div>
                    <p class="text-[11px] text-slate-500 font-medium">Izin / Sakit</p>
                    <p id="stIzinCount" class="text-lg font-bold text-slate-800">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-3">
                <div class="p-3 bg-rose-100 text-rose-600 rounded-xl"><i class="fas fa-times-circle text-lg"></i></div>
                <div>
                    <p class="text-[11px] text-slate-500 font-medium">Alpa</p>
                    <p id="stAlpaCount" class="text-lg font-bold text-slate-800">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-3">
                <div class="p-3 bg-indigo-100 text-indigo-600 rounded-xl"><i class="fas fa-chart-line text-lg"></i></div>
                <div>
                    <p class="text-[11px] text-slate-500 font-medium">Persentase Kehadiran</p>
                    <p id="stAttendanceRate" class="text-lg font-bold text-indigo-600">0%</p>
                </div>
            </div>
        </div>

        <!-- Form Absen Mandiri -->
        <div class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-2xl shadow-lg p-6 relative overflow-hidden">
            <div class="relative z-10 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold flex items-center gap-2">
                        <i class="fas fa-pen-to-square text-indigo-400"></i> Form Absen Mandiri Mahasiswa
                    </h2>
                    <span id="stSessionStatusBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                        Memuat Status...
                    </span>
                </div>
                <div id="activeSessionBox" class="bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/10 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-indigo-200 font-medium mb-1">Pertemuan Aktif</label>
                            <input type="text" id="stMeetingInput" readonly value="Belum Ada Sesi" class="w-full bg-white/10 border border-white/20 rounded-xl p-2.5 text-sm font-bold text-white cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs text-indigo-200 font-medium mb-1">Status Kehadiran</label>
                            <select id="stStatusSelect" onchange="toggleNoteField()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-400">
                                <option value="Hadir">Hadir</option>
                                <option value="Izin">Izin</option>
                                <option value="Sakit">Sakit</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-indigo-200 font-medium mb-1">Masukkan PIN Sesi Dosen</label>
                            <input type="text" id="stPinInput" placeholder="4-6 Digit PIN" maxlength="6" class="w-full bg-white text-slate-900 font-mono tracking-widest text-center font-bold rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-400">
                        </div>
                    </div>
                    <div id="stNoteContainer" class="hidden">
                        <label class="block text-xs text-indigo-200 font-medium mb-1">Alasan / Catatan (Izin/Sakit)</label>
                        <input type="text" id="stNoteInput" placeholder="Tuliskan keterangan..." class="w-full bg-white/10 border border-white/20 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                    </div>
                    <button id="btnSubmitAttendance" onclick="submitAttendance()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i> Kirim Presensi Sekarang
                    </button>
                </div>
            </div>
        </div>

        <!-- Matrix Riwayat Kehadiran Mahasiswa -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i class="fas fa-history text-indigo-600"></i> Status Kehadiran (Pertemuan 1 - 16)
            </h3>
            <div id="stGridHistory" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2.5">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>

    <!-- Modal Notifikasi Custom -->
    <div id="customModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-sm w-full p-6 text-center space-y-4">
            <div id="customModalIcon" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-emerald-100 text-emerald-600">
                <i class="fas fa-info-circle"></i>
            </div>
            <h3 id="customModalTitle" class="font-bold text-slate-800 text-base">Informasi</h3>
            <p id="customModalMessage" class="text-xs text-slate-600 leading-relaxed"></p>
            <div id="customModalActions" class="pt-2 flex justify-center gap-2">
                <button onclick="closeCustomModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx4JPR-g84f4RYn7xWcsd8F7Bq6pUihDs6V8zhZ3OF9Im5Al01OZl_18gZFoj4eZn7DJw/exec';
        
        const STUDENTS = [
            {"nim": "26050974010", "nama": "Rani Laili Fithriyani"},
            {"nim": "26050974027", "nama": "Rendy Ardika Putra Pratama"},
            {"nim": "26050974031", "nama": "Salza Maulidya Anjani"},
            {"nim": "26050974052", "nama": "Lauhil Ikhsani"},
            {"nim": "26050974060", "nama": "Efanes William Patiaraja Silaban"},
            {"nim": "26050974068", "nama": "Riska Alfiana"},
            {"nim": "26050974069", "nama": "Ardy Prasetyo Afandy"},
            {"nim": "26050974073", "nama": "Qayla Meisyahila Aniem"},
            {"nim": "26050974077", "nama": "Kakung Adhityatalenta"},
            {"nim": "26050974082", "nama": "Eka Kartika Sari"},
            {"nim": "26050974086", "nama": "Kharisma Qurotta A'yunni"},
            {"nim": "26050974091", "nama": "Adela Al Alaz"},
            {"nim": "26050974092", "nama": "Zahran rafif Ariffuddin"},
            {"nim": "26050974094", "nama": "Mochmmad Rifani Rohman"},
            {"nim": "26050974099", "nama": "Saylendra Surya Agung"},
            {"nim": "26050974105", "nama": "Chuzayn Ibadillah Almuqarrabin"},
            {"nim": "26050974108", "nama": "Hafizh Abrizam Deswantara"},
            {"nim": "26050974110", "nama": "Bahruddin Kendilwessy"},
            {"nim": "26050974111", "nama": "Putri Rizki Ardana"},
            {"nim": "26050974112", "nama": "Muhammad Fathih Ali Arrahman"},
            {"nim": "26050974118", "nama": "Lingga Bagus Bayuanggara"},
            {"nim": "26050974120", "nama": "Nurul Aini"},
            {"nim": "26050974122", "nama": "Muhammad Adnan Sabriila"},
            {"nim": "26050974126", "nama": "Raisah Sharliz Maherummisa"},
            {"nim": "26050974128", "nama": "Muhammad Shafrizal Al Ghozali"},
            {"nim": "26050974138", "nama": "Ayuni Putri Arifianti"},
            {"nim": "26050974139", "nama": "Nugroho Sutarko"},
            {"nim": "26050974140", "nama": "Achmad Alamil Huda"},
            {"nim": "26050974141", "nama": "Firnando Astrian Ramadhani"},
            {"nim": "26050974144", "nama": "Chelsea Negar Kuncoro"},
            {"nim": "26050974153", "nama": "Imtiaz Ahmad"},
            {"nim": "26050974155", "nama": "Achmad Fardhan Khafid"},
            {"nim": "26050974156", "nama": "Diva Qurrota A'yunin"},
            {"nim": "26050974160", "nama": "Himmah Qadriyah Almu'in"},
            {"nim": "26050974161", "nama": "Marco Ardiansyah Putra"},
            {"nim": "26050974165", "nama": "Achmad Qodri Azizi"},
            {"nim": "26050974166", "nama": "Muhammad Farrel Ivansyah Putra"},
            {"nim": "26050974168", "nama": "Neolene Putri Kusuma Wardhani"},
            {"nim": "26050974169", "nama": "Nauraffa Rayyano"},
            {"nim": "26050974173", "nama": "Muhammad Alif Farhan"},
            {"nim": "26050974174", "nama": "Mohammad Rafi Baihaqi"},
            {"nim": "26050974175", "nama": "Reihan Soma Sudarman"},
            {"nim": "26050974178", "nama": "Raihanun"},
            {"nim": "26050974180", "nama": "Ahmad Raka Saputra"},
            {"nim": "26050974181", "nama": "Rizky Yulief Estiawan"}
        ];

        let attendanceData = {};
        let activeSession = { meeting: 1, isOpen: false, pin: "1234" }; 

        window.onload = function() {
            initData();
            initStudentSelect();
            onStudentChange();
            updateSessionUI();
            
            // Cek status sesi otomatis dari Google Sheets setiap 5 detik
            setInterval(fetchSessionFromSheets, 5000);
        };

        function initData() {
            const savedAttendance = localStorage.getItem('pti_2026c_attendance');
            if (savedAttendance) {
                attendanceData = JSON.parse(savedAttendance);
            } else {
                STUDENTS.forEach(s => {
                    attendanceData[s.nim] = {};
                    for(let m=1; m<=7; m++) {
                        attendanceData[s.nim][m] = { status: 'Hadir', timestamp: 'Terabsen Otomatis', note: '' };
                    }
                });
                localStorage.setItem('pti_2026c_attendance', JSON.stringify(attendanceData));
            }
            fetchSessionFromSheets();
        }

        function fetchSessionFromSheets() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data.isOpen !== 'undefined') {
                        activeSession = data;
                        updateSessionUI();
                    }
                })
                .catch(err => console.error("Gagal mengambil status sesi:", err));
        }

        function initStudentSelect() {
            const select = document.getElementById('studentSelect');
            select.innerHTML = '';
            STUDENTS.forEach((s, i) => {
                const opt = document.createElement('option');
                opt.value = s.nim;
                opt.textContent = `${i + 1}. ${s.nama} (${s.nim})`;
                select.appendChild(opt);
            });
        }

        function onStudentChange() {
            const nim = document.getElementById('studentSelect').value;
            const records = attendanceData[nim] || {};
            let hadir = 0, izin = 0, alpa = 0;
            for(let m=1; m<=16; m++) {
                const st = records[m] ? records[m].status : '-';
                if(st === 'Hadir') hadir++;
                else if(st === 'Izin' || st === 'Sakit') izin++;
                else if(st === 'Alpa') alpa++;
            }
            document.getElementById('stHadirCount').textContent = hadir;
            document.getElementById('stIzinCount').textContent = izin;
            document.getElementById('stAlpaCount').textContent = alpa;
            document.getElementById('stAttendanceRate').textContent = `${Math.round((hadir / 16) * 100)}%`;
            const grid = document.getElementById('stGridHistory');
            grid.innerHTML = '';
            for(let m=1; m<=16; m++) {
                const rec = records[m];
                const status = rec ? rec.status : '-';
                let colorClass = "bg-slate-100 border-slate-200 text-slate-500";
                if (status === 'Hadir') colorClass = "bg-emerald-50 border-emerald-200 text-emerald-700";
                if (status === 'Izin' || status === 'Sakit') colorClass = "bg-amber-50 border-amber-200 text-amber-700";
                if (status === 'Alpa') colorClass = "bg-rose-50 border-rose-200 text-rose-700";
                grid.innerHTML += `
                    <div class="p-2.5 rounded-xl border ${colorClass} text-center space-y-1">
                        <p class="text-[10px] font-bold uppercase tracking-wider opacity-75">P${m}</p>
                        <p class="text-xs font-extrabold">${status}</p>
                    </div>
                `;
            }
        }

        function toggleNoteField() {
            const status = document.getElementById('stStatusSelect').value;
            const noteContainer = document.getElementById('stNoteContainer');
            if (status === 'Izin' || status === 'Sakit') {
                noteContainer.classList.remove('hidden');
            } else {
                noteContainer.classList.add('hidden');
            }
        }

        function submitAttendance() {
            const nim = document.getElementById('studentSelect').value;
            const pin = document.getElementById('stPinInput').value.trim();
            const status = document.getElementById('stStatusSelect').value;
            const note = document.getElementById('stNoteInput').value.trim();

            if (!activeSession.isOpen) {
                showModal("Sesi Ditutup", "Sesi presensi mandiri saat ini sedang ditutup oleh Dosen.", "warning");
                return;
            }
            if (pin !== activeSession.pin) {
                showModal("PIN Salah", "PIN sesi yang Anda masukkan tidak sesuai.", "danger");
                return;
            }

            const btn = document.getElementById('btnSubmitAttendance');
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Mengirim...`;
            btn.disabled = true;

            const dataPresensi = {
                nim: nim,
                status: status,
                pertemuan: activeSession.meeting,
                keterangan: note
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataPresensi)
            })
            .then(() => console.log("Pengiriman presensi berhasil"))
            .catch(error => console.error('Gagal mengirim ke Sheets:', error))
            .finally(() => {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            });

            if (!attendanceData[nim]) attendanceData[nim] = {};
            attendanceData[nim][activeSession.meeting] = {
                status: status,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                note: note
            };
            localStorage.setItem('pti_2026c_attendance', JSON.stringify(attendanceData));
            onStudentChange();

            document.getElementById('stPinInput').value = '';
            document.getElementById('stNoteInput').value = '';

            showModal("Presensi Berhasil", `Presensi Pertemuan ${activeSession.meeting} berstatus (${status}) berhasil disimpan!`, "success");
        }

        function updateSessionUI() {
            const stBadge = document.getElementById('stSessionStatusBadge');
            const stMeetingInput = document.getElementById('stMeetingInput');
            if(activeSession.isOpen) {
                stMeetingInput.value = `Pertemuan ${activeSession.meeting}`;
                stBadge.className = "text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                stBadge.textContent = `Sesi P${activeSession.meeting} DIBUKA`;
            } else {
                stMeetingInput.value = `Belum Ada Sesi (Tutup)`;
                stBadge.className = "text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30";
                stBadge.textContent = "Sesi DITUTUP";
            }
        }

        function showModal(title, message, type='info') {
            const modal = document.getElementById('customModal');
            const titleEl = document.getElementById('customModalTitle');
            const msgEl = document.getElementById('customModalMessage');
            const iconEl = document.getElementById('customModalIcon');
            titleEl.textContent = title;
            msgEl.textContent = message;
            if (type === 'success') {
                iconEl.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-emerald-100 text-emerald-600";
                iconEl.innerHTML = `<i class="fas fa-check-circle"></i>`;
            } else if (type === 'danger') {
                iconEl.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-rose-100 text-rose-600";
                iconEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i>`;
            } else if (type === 'warning') {
                iconEl.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-amber-100 text-amber-600";
                iconEl.innerHTML = `<i class="fas fa-exclamation-circle"></i>`;
            } else {
                iconEl.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-indigo-100 text-indigo-600";
                iconEl.innerHTML = `<i class="fas fa-info-circle"></i>`;
            }
            modal.classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
        }
    </script>
</body>
</html>
